name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update && sudo apt-get install -y xvfb libxtst6
      - run: npm ci
      - run: npm ci
        working-directory: server
      - run: npm ci
        working-directory: host
      - run: npm test
        working-directory: server
      - name: End-to-end (server + host + browser)
        run: xvfb-run -a -s "-screen 0 1280x800x24" node test/e2e.mjs

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: host
      - run: npm run dist:win
        working-directory: host
      - uses: actions/upload-artifact@v4
        with:
          name: shackle-windows
          path: host/dist/*.exe
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: host
      - run: npm run dist:mac
        working-directory: host
      - uses: actions/upload-artifact@v4
        with:
          name: shackle-macos
          path: host/dist/*.dmg
          if-no-files-found: error

  # Publishes a release the first time a new version number (host/package.json) lands on main.
  release:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [test, windows, macos]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Decide
        id: v
        run: |
          VERSION=$(node -p "require('./host/package.json').version")
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" >/dev/null 2>&1; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/download-artifact@v4
        if: steps.v.outputs.exists == 'false'
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        if: steps.v.outputs.exists == 'false'
        run: cd artifacts && sha256sum Shackle-* > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        if: steps.v.outputs.exists == 'false'
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Shackle ${{ steps.v.outputs.tag }}
          files: artifacts/*
          generate_release_notes: true
          make_latest: true
